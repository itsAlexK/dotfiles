onboarding = false

# Direct alt chords for frequent actions (kitty: macos_option_as_alt left).
# Everything else stays on the ctrl+b prefix.
[keys]
switch_tab = ["prefix+1..9", "alt+1..9"]
next_tab = ["prefix+n", "alt+shift+]", "alt+}"]
previous_tab = ["prefix+p", "alt+shift+[", "alt+{"]
cycle_pane_next = ["prefix+tab", "alt+]"]
cycle_pane_previous = ["prefix+shift+tab", "alt+["]
new_tab = ["prefix+c", "alt+t"]
new_workspace = ["prefix+shift+n", "alt+n"]
move_tab_previous = "prefix+shift+comma"
move_tab_next = "prefix+shift+period"
switch_workspace = "alt+shift+1..9"
previous_workspace = "alt+up"
next_workspace = "alt+down"
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]
swap_pane_left = ["prefix+shift+h", "alt+shift+h"]
swap_pane_down = ["prefix+shift+j", "alt+shift+j"]
swap_pane_up = ["prefix+shift+k", "alt+shift+k"]
swap_pane_right = ["prefix+shift+l", "alt+shift+l"]
split_vertical = ["prefix+v", "alt+backslash"]
split_horizontal = ["prefix+minus", "alt+minus", "alt+enter", "alt+shift+enter"]
zoom = ["prefix+z", "alt+z"]
next_agent = "alt+a"
previous_agent = "alt+shift+a"
goto = ["prefix+g", "alt+g"]
workspace_picker = "prefix+w"
close_pane = ["prefix+x", "alt+w"]
close_tab = ["prefix+shift+x", "alt+shift+w"]
